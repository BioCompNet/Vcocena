name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # glpkAPI needs the GLPK C library. pak installs SystemRequirements on
      # Ubuntu automatically; macOS runners need it via Homebrew.
      - name: Install GLPK (macOS)
        if: runner.os == 'macOS'
        run: brew install glpk
      # MCDA was archived from CRAN on 2025-11-20 and its dependency glpkAPI on
      # 2026-03-20, so pak cannot resolve them from any repository and the whole
      # dependency solve fails with "Can't find package called MCDA". Both are
      # used on the main execution path, so they are pulled from the CRAN
      # archive by explicit URL.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            url::https://cran.r-project.org/src/contrib/Archive/glpkAPI/glpkAPI_1.3.4.1.tar.gz
            url::https://cran.r-project.org/src/contrib/Archive/MCDA/MCDA_0.1.0.tar.gz
          needs: check
      - uses: r-lib/actions/check-r-package@v2
