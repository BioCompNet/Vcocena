name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      # glpkAPI needs the GLPK C library. pak installs SystemRequirements on
      # Ubuntu automatically; macOS runners need it via Homebrew.
      - name: Install GLPK (macOS)
        if: runner.os == 'macOS'
        run: brew install glpk
      # MCDA (archived 2025-11-20) and glpkAPI (archived 2026-03-20) are not in
      # any repository. They are resolved via the Remotes: field in DESCRIPTION,
      # which pak reads when solving this package's own dependencies.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
