name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      # MCDA (archived from CRAN 2025-11-20) and its dependency glpkAPI (archived
      # 2026-03-20) are both on the main execution path. This dated snapshot
      # predates both archivals and serves them as ordinary packages, so they
      # resolve transitively. It is a secondary repo -- pak picks the highest
      # version across repos, so everything else still comes from current CRAN.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          extra-repositories: 'https://packagemanager.posit.co/cran/2025-11-01'

      # glpkAPI needs the GLPK C library. pak installs SystemRequirements on
      # Ubuntu automatically; macOS runners need it via Homebrew.
      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install glpk cairo
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
          needs: check
      # The package declares 40 blanket import() directives, which produce ~12
      # "replacing previous import" warnings at load time (igraph/dplyr,
      # plotly/clusterProfiler, and similar). Those are inherent to the import
      # style, not defects in any given change, and the default error-on:
      # "warning" fails the build on them. Gate on errors so the check reports
      # real breakage. Removing the blanket imports in favour of namespace-
      # qualified calls would let this be tightened back to "warning".
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"error"'
