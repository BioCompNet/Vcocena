name: pkgdown

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # MCDA (archived from CRAN 2025-11-20) and its dependency glpkAPI (archived
      # 2026-03-20) are both on the main execution path. This dated snapshot
      # predates both archivals and serves them as ordinary packages, so they
      # resolve transitively. It is a secondary repo -- pak picks the highest
      # version across repos, so everything else still comes from current CRAN.
      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://packagemanager.posit.co/cran/2025-11-01'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
          needs: website
      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
