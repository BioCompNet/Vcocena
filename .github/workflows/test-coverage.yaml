name: test-coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      # MCDA (archived 2025-11-20) and glpkAPI (archived 2026-03-20) are not in
      # any repository. They are resolved via the Remotes: field in DESCRIPTION,
      # which pak reads when solving this package's own dependencies.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
          needs: coverage
      - name: Run coverage
        run: covr::codecov()
        shell: Rscript {0}
