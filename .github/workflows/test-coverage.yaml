name: test-coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # MCDA (archived from CRAN 2025-11-20) and its dependency glpkAPI (archived
      # 2026-03-20) are both on the main execution path. This dated snapshot
      # predates both archivals and serves them as ordinary packages, so they
      # resolve transitively. It is a secondary repo -- pak picks the highest
      # version across repos, so everything else still comes from current CRAN.
      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: 'https://packagemanager.posit.co/cran/2025-11-01'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
          needs: coverage
      - name: Run coverage
        run: covr::codecov()
        shell: Rscript {0}
